name: 自动更新 TrendForce 内存价格

on:
  schedule:
    # 🔔 多重闹钟轰炸，确保今天的数据百分之百落袋
    - cron: '0 7 * * *'  # 北京时间 16:00

  workflow_dispatch: 

jobs:
  update-excel:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 配置 Python
      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: 安装 Python 库
        run: pip install -r requirements.txt

     # 4. 📥 从网盘下载上一次保存的 Excel 总表（使用神级跨时空插件）
      - name: 下载历史 Excel 备份
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          name: memory-price-database
          path: .
        continue-on-error: true

      # 5. ⚙️ 运行你的核心 Python 爬虫脚本
      - name: 运行爬虫脚本并追加数据
        run: python run.py

      # 6. 🚀 【核心派送】通过企业微信官方标准接口，直接把 Excel 实体砸进你的手机
      - name: 推送 Excel 文件到企业微信
        run: |
          # 🔍 定位刚刚生成的、包含完整历史数据的最新 Excel 路径
          FILE_PATH=$(find . -maxdepth 1 -name "*.xlsx" | head -n 1)
          echo "📂 正在打包发送最新文件: $FILE_PATH"
          
          # 1️⃣ 将本地 Excel 文件上传到企业微信服务器，获取临时媒体文件 media_id
          UPLOAD_RESULT=$(curl -s -F media=@"$FILE_PATH" "https://qyapi.weixin.qq.com/cgi-bin/webhook/upload_media?key=${{ secrets.WECHAT_ROBOT_KEY }}&type=file")
          MEDIA_ID=$(echo $UPLOAD_RESULT | jq -r '.media_id')
          
          if [ "$MEDIA_ID" = "null" ] || [ -z "$MEDIA_ID" ]; then
            echo "❌ 文件上传到微信服务器失败，返回日志: $UPLOAD_RESULT"
            exit 1
          fi
          
          # 2️⃣ 调用群机器人，把这个 media_id 对应的实体文件推送到你的手机企业微信聊天框
          SEND_RESULT=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"msgtype\": \"file\", \"file\": {\"media_id\": \"$MEDIA_ID\"}}" \
            "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${{ secrets.WECHAT_ROBOT_KEY }}")
          
          echo "🎯 微信接口返回状态: $SEND_RESULT"

      # 7. 📤 闭环保存：把更新后的 Excel 重新塞回网盘，供明天定时任务使用
      - name: 上传最新的历史 Excel 备份到安全网盘
        uses: actions/upload-artifact@v4
        with:
          name: memory-price-database
          path: "*.xlsx"
          retention-days: 7
