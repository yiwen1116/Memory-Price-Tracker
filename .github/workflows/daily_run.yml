name: 自动更新 TrendForce 内存价格 (Public 历史累积版)

on:
  schedule:
    # 北京时间早上 08:40 = UTC 时间 00:40
    - cron: '37 1 * * *'
  workflow_dispatch: 

jobs:
  update-excel:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Python 库
        run: pip install -r requirements.txt

      # 📥 第一步：尝试从 GitHub 内部网盘下载昨天保存的历史 Excel 备份
      - name: 下载昨天的历史 Excel 备份
        uses: actions/download-artifact@v4
        with:
          name: memory-price-database
          path: .
        continue-on-error: true # 第一次运行时如果没有备份，容许它报错并继续

      # ⚙️ 第二步：运行 Python 追加今天的新数据
      - name: 运行爬虫脚本并追加数据
        run: python run.py

      # 🔍 第三步：锁定刚刚更新完的最新文件名
      - name: 检测今日最新的 excel 文件
        id: get_file
        run: |
          FILENAME=$(find . -maxdepth 1 -name "*.xlsx" | sed 's|./||' | head -n 1)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "🔍 成功锁定包含历史数据的附件: $FILENAME"

      # 🎯 第四步：发送带完整历史累计数据的邮件给你
      - name: 发送每日价格追踪邮件
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          username: 1343751957@qq.com # 👈 换成你的发件 QQ 邮箱
          password: ${{ secrets.MAIL_PASSWORD }}
          
          subject: 📊 今日内存价格追踪日报 (含历史趋势)
          to: 1343751957@qq.com # 👈 换成你的接收邮箱
          from: GitHub Action Robot
          
          body: |
            您好！
            
            今日内存价格数据已成功抓取，并已完美追加到历史数据库中。
            最新的完整历史趋势 Excel 报表已作为附件发送，请查收！
            
          attachments: ${{ steps.get_file.outputs.filename }}

      # 📤 第五步：把今天更新完的、包含所有历史数据的最新 Excel 重新打包存入私人安全网盘，供明天使用
      - name: 上传最新的历史 Excel 备份到安全网盘
        uses: actions/upload-artifact@v4
        with:
          name: memory-price-database
          path: "*.xlsx"
          retention-days: 7 # 备份保留7天，天天轮转，绝对够用
